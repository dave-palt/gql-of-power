name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (determines next -dev version after release)'
        required: true
        type: choice
        options:
          - minor
          - major
      force_release:
        description: 'Create the release PR even if only non-shippable files (docs, CI, tests…) changed'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate versions
        id: versions
        run: |
          CURRENT=$(node -p "require('./package.json').version.replace(/-dev$/, '')")
          BUMP="${{ github.event.inputs.version_bump }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "$BUMP" = "major" ]; then
            NEXT_DEV="$((MAJOR + 1)).0.0-dev"
          else
            NEXT_DEV="$MAJOR.$((MINOR + 1)).0-dev"
          fi

          echo "release=$CURRENT" >> $GITHUB_OUTPUT
          echo "next_dev=$NEXT_DEV" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP" >> $GITHUB_OUTPUT

      - name: Check for shippable changes since last release
        id: shippable
        env:
          FORCE_RELEASE: ${{ github.event.inputs.force_release }}
        run: |
          # Skip the release when NOTHING that ships to npm changed since the
          # last tag. Fail-safe: only skip when 100% of changed files are known
          # non-shippable paths (docs, CI, tests, examples, agent tooling…).
          # Any file outside that list (src/, tsconfig, lockfile, scripts/…)
          # forces a release. package.json needs special handling: develop's
          # "version" line ALWAYS differs from the tag (the -dev suffix), so it
          # only counts as shippable when a line other than "version" changed.
          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "force_release=true — skipping the shippable-changes check"
            echo "shippable=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG=$(git tag --sort=-creatordate | grep '^v' | head -1 || echo "")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag found — treating everything as shippable."
            echo "shippable=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD)
          if [ -z "$CHANGED" ]; then
            echo "No changes at all since $LAST_TAG — nothing to release."
            echo "shippable=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Load the file list into an array, one entry per changed file.
          # (while-read instead of mapfile: mapfile needs bash 4+, not everywhere available.)
          FILES=()
          while IFS= read -r FILE; do
            [ -n "$FILE" ] && FILES+=("$FILE")
          done < <(git diff --name-only "$LAST_TAG"..HEAD)
          echo "Changed files since $LAST_TAG:"
          printf '  %s\n' "${FILES[@]:-(none)}"

          SHIPPABLE_COUNT=0
          SHIPPABLE_LIST=""
          for FILE in "${FILES[@]}"; do
            [ -z "$FILE" ] && continue
            case "$FILE" in
              *.md|LICENSE|.github/**|tests/**|examples/**|scripts/**|agents/**|fallow-baselines/**|.fallow*|.prettier*|.npmignore|.gitignore|bunfig.toml|AGENTS.md|CLAUDE.md|EXAMPLES.md|TODO.md|WARP.md)
                ;; # non-shippable
              package.json)
                # develop's version line always differs (the -dev suffix);
                # package.json only counts when another line changed.
                if git diff "$LAST_TAG"..HEAD -- package.json | grep -E '^[+-][^+-]' | grep -Ev '^[+-]\s*"version":' | grep -q .; then
                  SHIPPABLE_COUNT=$((SHIPPABLE_COUNT+1))
                  SHIPPABLE_LIST="$SHIPPABLE_LIST
          $FILE (non-version package.json change)"
                fi
                ;;
              *)
                SHIPPABLE_COUNT=$((SHIPPABLE_COUNT+1))
                SHIPPABLE_LIST="$SHIPPABLE_LIST
          $FILE"
                ;;
            esac
            done

          if [ "$SHIPPABLE_COUNT" -gt 0 ]; then
            echo "Shippable changes detected:"
            echo "$SHIPPABLE_LIST"
            echo "shippable=true" >> $GITHUB_OUTPUT
          else
            echo "Only non-shippable files changed since $LAST_TAG — skipping release."
            echo "shippable=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release branch
        if: steps.shippable.outputs.shippable == 'true'
        run: |
          BRANCH_NAME="release/${{ steps.versions.outputs.release }}"
          git checkout -b "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Update package.json to release version
        if: steps.shippable.outputs.shippable == 'true'
        run: |
          bun run scripts/update-version.ts ${{ steps.versions.outputs.release }}

      - name: Commit release version
        if: steps.shippable.outputs.shippable == 'true'
        run: |
          git add package.json
          git commit -m "chore: bump version to ${{ steps.versions.outputs.release }}"
          git push origin "${{ env.branch }}"

      - name: Gather changes since last release
        id: changes
        if: steps.shippable.outputs.shippable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git tag --sort=-creatordate | grep '^v' | head -1 || echo "")
          if [ -n "$LAST_TAG" ]; then
            RAW_DATE=$(git log -1 --format=%cI "$LAST_TAG")
            TAG_DATE=$(date -u -d "$RAW_DATE" +%Y-%m-%dT%H:%M:%SZ)
            echo "Last release: $LAST_TAG ($TAG_DATE)"
          else
            TAG_DATE="2000-01-01T00:00:00Z"
            LAST_TAG="(first release)"
            echo "No previous release tag found. Listing all merged PRs."
          fi

          # -X GET is required: gh api defaults to POST when -f flags are passed,
          # and the GitHub Search API only accepts GET — POST returns HTTP 404.
          PRS=$(gh api -X GET "/search/issues" \
            -f q="repo:${{ github.repository }} base:develop is:merged merged:>$TAG_DATE" \
            -f sort=created \
            -f order=asc \
            -f per_page=100 \
            --jq '.items[] | "- #\(.number) \(.title) (@\(.user.login))"' 2>/dev/null || echo "")

          if [ -z "$PRS" ]; then
            PRS="(No pull requests merged to develop since $LAST_TAG)"
          fi

          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "pr_list<<EOF"
            echo "$PRS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request to main
        id: create_pr
        if: steps.shippable.outputs.shippable == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release }}
          BUMP_TYPE: ${{ steps.versions.outputs.bump_type }}
          NEXT_DEV: ${{ steps.versions.outputs.next_dev }}
          PR_LIST: ${{ steps.changes.outputs.pr_list }}
          LAST_TAG: ${{ steps.changes.outputs.last_tag }}
        with:
          script: |
            const releaseVersion = process.env.RELEASE_VERSION;
            const bumpType = process.env.BUMP_TYPE;
            const nextDev = process.env.NEXT_DEV;
            const prList = process.env.PR_LIST || '';
            const lastTag = process.env.LAST_TAG || 'first release';

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release v${releaseVersion}`,
              head: process.env.branch,
              base: 'main',
              body: `## Release v${releaseVersion}

              This PR prepares the release of version \`${releaseVersion}\`.

              ### Changes Since ${lastTag}

              ${prList}

              ### Version Bump
              - Type: **${bumpType}**
              - Version: \`${releaseVersion}\`
              - Next develop version: \`${nextDev}\`

              ### Next Steps
              1. Review and merge this PR
              2. The release workflow will automatically:
                 - Tag the release
                 - Publish to npm
                 - Create GitHub release (with auto-generated notes)
                 - Merge changes back to develop
                 - Bump develop to \`${nextDev}\`

              **Auto-generated by prepare-release workflow**`,
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [`release:${bumpType}`]
            });

            console.log(`Created PR #${pr.number}`);
            return pr.number;

      - name: Output summary
        run: |
          echo "## Release Preparation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.shippable.outputs.shippable }}" != "true" ]; then
            echo "⏭️ Nothing to release — only non-shippable files (docs, CI, tests…) changed since ${{ steps.shippable.outputs.last_tag }}." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No release PR was created; npm was not touched. Re-run with **force_release** if you want one anyway." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## Release Preparation Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Version**: ${{ steps.versions.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type**: ${{ steps.versions.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Dev Version**: ${{ steps.versions.outputs.next_dev }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Merge the PR to trigger the release workflow." >> $GITHUB_STEP_SUMMARY
